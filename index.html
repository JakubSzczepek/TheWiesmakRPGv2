<!DOCTYPE html>\n<html lang="pl">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Karta Postaci</title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }\n        @page { size: A4; margin: 20mm; }\n        .container { display: flex; flex-direction: column; }\n        .page { page-break-after: always; padding: 20px; border: 1px solid #ccc; margin-bottom: 20px; }\n        h1, h2, h3 { text-align: center; }\n        .stats, .traits, .spells, .equipment, .notes { margin: 20px 0; }\n        button { margin-top: 10px; }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <div class="page">\n            <h1>Karta Postaci</h1>\n            <div class="stats">\n                <h2>Statystyki</h2>\n                <p>Siła: <input type="text" id="strength" /></p>\n                <p>Zręczność: <input type="text" id="dexterity" /></p>\n                <p>Inteligencja: <input type="text" id="intelligence" /></p>\n            </div>\n            <div class="traits">\n                <h2>Cechy</h2>\n                <textarea id="traits" rows="4" cols="50"></textarea>\n            </div>\n            <div class="spells">\n                <h2>Zaklęcia</h2>\n                <textarea id="spells" rows="4" cols="50"></textarea>\n            </div>\n            <div class="equipment">\n                <h2>Wyposażenie</h2>\n                <textarea id="equipment" rows="4" cols="50"></textarea>\n            </div>\n            <div class="notes">\n                <h2>Notatki</h2>\n                <textarea id="notes" rows="4" cols="50"></textarea>\n            </div>\n            <button onclick="exportToJson()">Eksportuj do JSON</button>\n            <button onclick="importFromJson()">Importuj z JSON</button>\n        </div>\n\n        <script>\n            function exportToJson() {\n                const characterData = {\n                    strength: document.getElementById('strength').value,\n                    dexterity: document.getElementById('dexterity').value,\n                    intelligence: document.getElementById('intelligence').value,\n                    traits: document.getElementById('traits').value,\n                    spells: document.getElementById('spells').value,\n                    equipment: document.getElementById('equipment').value,\n                    notes: document.getElementById('notes').value\n                };\n                const jsonString = JSON.stringify(characterData);\n                const blob = new Blob([jsonString], { type: 'application/json' });\n                const url = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                a.href = url;\n                a.download = 'character_data.json';\n                a.click();\n                URL.revokeObjectURL(url);\n            }\n            function importFromJson() {\n                const input = document.createElement('input');\n                input.type = 'file';\n                input.accept = 'application/json';\n                input.onchange = e => {\n                    const file = e.target.files[0];\n                    const reader = new FileReader();\n                    reader.onload = event => {\n                        const characterData = JSON.parse(event.target.result);\n                        document.getElementById('strength').value = characterData.strength;\n                        document.getElementById('dexterity').value = characterData.dexterity;\n                        document.getElementById('intelligence').value = characterData.intelligence;\n                        document.getElementById('traits').value = characterData.traits;\n                        document.getElementById('spells').value = characterData.spells;\n                        document.getElementById('equipment').value = characterData.equipment;\n                        document.getElementById('notes').value = characterData.notes;\n                    };\n                    reader.readAsText(file);\n                };\n                input.click();\n            }\n        </script>\n    </div>\n</body>\n</html>
